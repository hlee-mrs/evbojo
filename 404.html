<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EV보조금 서비스 종료 안내</title>
<meta name="robots" content="noindex">
<meta name="description" content="EV보조금(evbojo.co.kr)은 2026년 11월 16일부로 운영을 종료했습니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1a2230;--text2:#4a5565;--line:#e3e7ec;--link:#0b63ce}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b2129;--text:#e8ecf1;--text2:#a9b3c0;--line:#2a323d;--link:#7ab8ff}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;line-height:1.7;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 28px}
h1{margin:0 0 18px;font-size:1.25rem;line-height:1.45;word-break:keep-all}
p{margin:0 0 14px;color:var(--text2);word-break:keep-all}
p:last-child{margin-bottom:0}
a{color:var(--link);text-underline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>EV보조금(evbojo.co.kr) 서비스 종료 안내</h1>
  <p>2026년 11월 16일부로 운영을 종료했습니다.</p>
  <p>전기차 구매보조금의 최신 공고와 잔여 현황은 <a href="https://ev.or.kr/" rel="noopener">무공해차 통합누리집(ev.or.kr)</a>과 각 지자체 공고에서 확인해 주세요.</p>
  <p>그동안 이용해 주셔서 감사합니다.</p>
</main>
</body>
</html>
